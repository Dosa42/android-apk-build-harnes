name: Deterministic Android APK build harness
description: Detects a target project's pinned Android toolchain, prepares it, builds APKs, verifies artifacts, and audits Samsung DeX compatibility.

inputs:
  target-path:
    description: Path of the already checked-out target Android repository.
    required: true
  variant:
    description: "Android build selection: debug, release, or both."
    required: false
    default: debug
  run-tests:
    description: Run applicable discovered JVM unit-test tasks.
    required: false
    default: "true"
  run-lint:
    description: Run applicable discovered Android lint tasks.
    required: false
    default: "true"
  build-bundle:
    description: Also require Android App Bundles in addition to APKs.
    required: false
    default: "false"
  dex-audit:
    description: Run the Samsung DeX compatibility audit.
    required: false
    default: "true"
  output-directory:
    description: Harness output directory, absolute or relative to GITHUB_WORKSPACE. It must be outside the target checkout.
    required: false
    default: android-harness-output
  java-distribution:
    description: JDK distribution for the project-derived Java version.
    required: false
    default: temurin
  release-keystore-base64:
    description: Base64-encoded release keystore supplied from a GitHub Actions secret.
    required: false
    default: ""
  release-keystore:
    description: Existing release keystore path on the runner; base64 input is preferred on hosted runners.
    required: false
    default: ""
  release-store-password:
    description: Release keystore password supplied from a GitHub Actions secret.
    required: false
    default: ""
  release-key-password:
    description: Release key password supplied from a GitHub Actions secret.
    required: false
    default: ""
  release-key-alias:
    description: Release key alias.
    required: false
    default: upload
  debug-keystore-base64:
    description: Optional base64-encoded debug keystore.
    required: false
    default: ""
  debug-keystore:
    description: Optional existing debug keystore path on the runner.
    required: false
    default: ""
  debug-store-password:
    description: Optional debug keystore password.
    required: false
    default: android
  debug-key-password:
    description: Optional debug key password.
    required: false
    default: android
  debug-key-alias:
    description: Optional debug key alias.
    required: false
    default: androiddebugkey

outputs:
  project-root:
    description: Canonical target checkout root.
    value: ${{ steps.resolve.outputs.project-root }}
  gradle-version:
    description: Gradle version derived from gradle-wrapper.properties.
    value: ${{ steps.resolve.outputs.gradle-version }}
  agp-version:
    description: Android Gradle Plugin version derived from target configuration.
    value: ${{ steps.resolve.outputs.agp-version }}
  java-version:
    description: JDK runtime version selected from the explicit AGP/Gradle compatibility map.
    value: ${{ steps.resolve.outputs.java-version }}
  compile-sdk:
    description: Comma-separated compile SDK versions used by application modules.
    value: ${{ steps.resolve.outputs.compile-sdk }}
  build-tools-version:
    description: Comma-separated exact Android Build Tools versions.
    value: ${{ steps.resolve.outputs.build-tools-version }}
  ndk-version:
    description: Comma-separated exact NDK versions, empty when native tooling is not required.
    value: ${{ steps.resolve.outputs.ndk-version }}
  cmake-version:
    description: Comma-separated exact CMake versions, empty when not declared.
    value: ${{ steps.resolve.outputs.cmake-version }}
  application-modules:
    description: JSON array of detected com.android.application module paths.
    value: ${{ steps.resolve.outputs.application-modules }}
  selected-modules:
    description: JSON array of application modules selected for building.
    value: ${{ steps.resolve.outputs.selected-modules }}
  variants:
    description: JSON array of variants derived from real Gradle assemble tasks.
    value: ${{ steps.resolve.outputs.variants }}
  sdk-packages:
    description: JSON array of exact Android SDK packages requested by the project.
    value: ${{ steps.resolve.outputs.sdk-packages }}
  has-pom:
    description: Whether the target contains a Maven pom.xml outside generated directories.
    value: ${{ steps.resolve.outputs.has-pom }}
  output-directory:
    description: Canonical harness output root.
    value: ${{ steps.paths.outputs.output-directory }}
  artifact-directory:
    description: Directory containing current-run APK/AAB copies.
    value: ${{ steps.paths.outputs.artifact-directory }}
  report-directory:
    description: Directory containing environment, build, verification, and DeX reports.
    value: ${{ steps.paths.outputs.report-directory }}
  log-directory:
    description: Directory containing retained command logs.
    value: ${{ steps.paths.outputs.log-directory }}
  environment-report:
    description: Final environment and Gradle-task discovery JSON report.
    value: ${{ steps.resolve.outputs.environment-report }}
  sdk-packages-report:
    description: Exact SDK installation and verification report.
    value: ${{ steps.prepare-sdk.outputs.report }}
  gradle-tasks-file:
    description: Full output from the target Wrapper's tasks --all command.
    value: ${{ steps.resolve.outputs.gradle-tasks-file }}
  artifact-manifest:
    description: JSON verification manifest for artifacts produced by this run.
    value: ${{ steps.verify.outputs.artifact-manifest }}
  dex-report:
    description: Samsung DeX audit JSON report, empty when the audit is disabled.
    value: ${{ steps.dex.outputs.dex-report }}

runs:
  using: composite
  steps:
    - name: Validate inputs and prepare output paths
      id: paths
      shell: bash
      env:
        INPUT_TARGET_PATH: ${{ inputs.target-path }}
        INPUT_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        INPUT_VARIANT: ${{ inputs.variant }}
        INPUT_RUN_TESTS: ${{ inputs.run-tests }}
        INPUT_RUN_LINT: ${{ inputs.run-lint }}
        INPUT_BUILD_BUNDLE: ${{ inputs.build-bundle }}
        INPUT_DEX_AUDIT: ${{ inputs.dex-audit }}
      run: |
        set -Eeuo pipefail
        case "$INPUT_VARIANT" in
          debug|release|both) ;;
          *) echo "::error title=Invalid build variant::Expected debug, release, or both; got $INPUT_VARIANT"; exit 2 ;;
        esac
        for value in "$INPUT_RUN_TESTS" "$INPUT_RUN_LINT" "$INPUT_BUILD_BUNDLE" "$INPUT_DEX_AUDIT"; do
          case "$value" in
            true|false) ;;
            *) echo "::error title=Invalid boolean input::Expected true or false; got $value"; exit 2 ;;
          esac
        done
        project_root="$(realpath "$INPUT_TARGET_PATH")"
        if [[ ! -d "$project_root" ]]; then
          echo "::error title=Missing target checkout::Target path is not a directory: $project_root"
          exit 2
        fi
        if [[ "$INPUT_OUTPUT_DIRECTORY" = /* ]]; then
          output_root="$(realpath -m "$INPUT_OUTPUT_DIRECTORY")"
        else
          output_root="$(realpath -m "$GITHUB_WORKSPACE/$INPUT_OUTPUT_DIRECTORY")"
        fi
        case "$output_root/" in
          "$project_root/"*)
            echo "::error title=Unsafe output directory::Harness output must be outside the target checkout: $output_root"
            exit 2
            ;;
        esac
        artifact_dir="$output_root/artifacts"
        report_dir="$output_root/reports"
        log_dir="$output_root/logs"
        android_user_home="${RUNNER_TEMP:-$output_root/tmp}/android-user-home"
        mkdir -p "$artifact_dir" "$report_dir" "$log_dir" "$android_user_home"
        {
          echo "HARNESS_PROJECT_ROOT=$project_root"
          echo "HARNESS_OUTPUT_ROOT=$output_root"
          echo "HARNESS_ARTIFACT_DIR=$artifact_dir"
          echo "HARNESS_REPORT_DIR=$report_dir"
          echo "HARNESS_LOG_DIR=$log_dir"
          echo "ANDROID_USER_HOME=$android_user_home"
        } >>"$GITHUB_ENV"
        {
          echo "project-root=$project_root"
          echo "output-directory=$output_root"
          echo "artifact-directory=$artifact_dir"
          echo "report-directory=$report_dir"
          echo "log-directory=$log_dir"
        } >>"$GITHUB_OUTPUT"

    - name: Resolve pinned Android environment
      id: doctor
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/project-doctor.py" \
          --project "$HARNESS_PROJECT_ROOT" \
          --report "$HARNESS_REPORT_DIR/environment-static.json"

    - name: Set up bootstrap JDK for Android SDK manager
      id: bootstrap-java
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: "17"

    - name: Set up Android command-line tools
      uses: android-actions/setup-android@v4

    - name: Install exact Android SDK packages
      id: prepare-sdk
      shell: bash
      env:
        CI: "true"
      run: |
        set -Eeuo pipefail
        "$GITHUB_ACTION_PATH/scripts/prepare-sdk.sh" \
          --sdk-root "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" \
          --doctor-report "$HARNESS_REPORT_DIR/environment-static.json" \
          --report "$HARNESS_REPORT_DIR/sdk-packages.txt" \
          --accept-licenses

    - name: Set up project-compatible JDK
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ steps.doctor.outputs.java-version }}

    - name: Set up pinned Gradle and cache
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: ${{ steps.doctor.outputs.gradle-version }}
        cache-provider: basic
        # The harness executes this official distribution, not target-owned
        # Wrapper JAR code. The exact version still comes from Wrapper properties.
        validate-wrappers: false

    - name: Verify official Gradle matches the target pin
      shell: bash
      env:
        EXPECTED_GRADLE_VERSION: ${{ steps.doctor.outputs.gradle-version }}
      run: |
        set -Eeuo pipefail
        gradle_path="$(command -v gradle)"
        [[ -x "$gradle_path" ]] || { echo "::error title=Gradle unavailable::setup-gradle did not expose an executable"; exit 2; }
        actual_version="$($gradle_path --version | awk '/^Gradle / { print $2; exit }')"
        if [[ "$actual_version" != "$EXPECTED_GRADLE_VERSION" ]]; then
          echo "::error title=Gradle pin mismatch::Wrapper properties require $EXPECTED_GRADLE_VERSION but setup-gradle exposed $actual_version"
          exit 2
        fi
        echo "HARNESS_GRADLE_COMMAND=$gradle_path" >>"$GITHUB_ENV"
        "$gradle_path" --version | tee "$HARNESS_LOG_DIR/gradle-version.log"

    - name: Verify Maven only for Maven auxiliary projects
      if: ${{ steps.doctor.outputs.has-pom == 'true' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        if command -v mvn >/dev/null 2>&1; then
          mvn --version | tee "$HARNESS_LOG_DIR/maven-version.log"
        elif [[ -f "$HARNESS_PROJECT_ROOT/mvnw" ]]; then
          bash "$HARNESS_PROJECT_ROOT/mvnw" --version | tee "$HARNESS_LOG_DIR/maven-version.log"
        else
          echo "::error title=Maven unavailable::A pom.xml exists, but neither mvn nor a Maven Wrapper is available."
          exit 2
        fi

    - name: Resolve real Gradle tasks and variants
      id: resolve
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/project-doctor.py" \
          --project "$HARNESS_PROJECT_ROOT" \
          --report "$HARNESS_REPORT_DIR/environment.json" \
          --tasks-file "$HARNESS_REPORT_DIR/gradle-tasks.txt" \
          --gradle-command "$HARNESS_GRADLE_COMMAND" \
          --resolve-tasks

    - name: Build, test, and lint selected variants
      id: build
      shell: bash
      env:
        ANDROID_RELEASE_KEYSTORE_BASE64: ${{ inputs.release-keystore-base64 }}
        ANDROID_RELEASE_KEYSTORE: ${{ inputs.release-keystore }}
        ANDROID_RELEASE_STORE_PASSWORD: ${{ inputs.release-store-password }}
        ANDROID_RELEASE_KEY_PASSWORD: ${{ inputs.release-key-password }}
        ANDROID_RELEASE_KEY_ALIAS: ${{ inputs.release-key-alias }}
        ANDROID_DEBUG_KEYSTORE_BASE64: ${{ inputs.debug-keystore-base64 }}
        ANDROID_DEBUG_KEYSTORE: ${{ inputs.debug-keystore }}
        ANDROID_DEBUG_STORE_PASSWORD: ${{ inputs.debug-store-password }}
        ANDROID_DEBUG_KEY_PASSWORD: ${{ inputs.debug-key-password }}
        ANDROID_DEBUG_KEY_ALIAS: ${{ inputs.debug-key-alias }}
        ANDROID_HARNESS_KEYTOOL: ${{ steps.bootstrap-java.outputs.path }}/bin/keytool
      run: |
        set -Eeuo pipefail
        arguments=(
          --project "$HARNESS_PROJECT_ROOT"
          --variant "${{ inputs.variant }}"
          --output-dir "$HARNESS_OUTPUT_ROOT"
        )
        if [[ "${{ inputs.run-tests }}" == "true" ]]; then
          arguments+=(--run-tests)
        else
          arguments+=(--skip-tests)
        fi
        if [[ "${{ inputs.run-lint }}" == "true" ]]; then
          arguments+=(--run-lint)
        else
          arguments+=(--skip-lint)
        fi
        if [[ "${{ inputs.build-bundle }}" == "true" ]]; then
          arguments+=(--bundle)
        else
          arguments+=(--skip-bundle)
        fi
        bash "$GITHUB_ACTION_PATH/scripts/run-build.sh" "${arguments[@]}"

    - name: Verify current-run Android artifacts
      id: verify
      shell: bash
      run: |
        set -Eeuo pipefail
        arguments=(
          --project "$HARNESS_PROJECT_ROOT"
          --variant "${{ inputs.variant }}"
          --artifact-dir "$HARNESS_ARTIFACT_DIR"
          --report-dir "$HARNESS_REPORT_DIR"
          --since-file "$HARNESS_REPORT_DIR/build-start.epoch"
          --require-apk
        )
        if [[ "${{ inputs.build-bundle }}" == "true" ]]; then
          arguments+=(--require-aab)
        fi
        python3 "$GITHUB_ACTION_PATH/scripts/verify-artifacts.py" "${arguments[@]}"
        manifest="$HARNESS_REPORT_DIR/artifact-verification.json"
        [[ -s "$manifest" ]] || { echo "::error title=Missing artifact manifest::$manifest was not produced"; exit 2; }
        echo "artifact-manifest=$manifest" >>"$GITHUB_OUTPUT"

    - name: Audit Samsung DeX compatibility
      id: dex
      if: ${{ inputs.dex-audit == 'true' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        report="$HARNESS_REPORT_DIR/dex-audit.json"
        python3 "$GITHUB_ACTION_PATH/scripts/dex-audit.py" \
          --project "$HARNESS_PROJECT_ROOT" \
          --variant "${{ inputs.variant }}" \
          --report "$report" \
          --markdown-report "$HARNESS_REPORT_DIR/dex-audit.md"
        [[ -s "$report" ]] || { echo "::error title=Missing DeX report::$report was not produced"; exit 2; }
        echo "dex-report=$report" >>"$GITHUB_OUTPUT"
