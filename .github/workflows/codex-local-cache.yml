name: Codex local Android toolchain cache

on:
  push:
    branches:
      - codex-embedded-source-build-20260827
    paths:
      - workbench/chunks/part-000

permissions:
  contents: read

jobs:
  prepare-local-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          sdkmanager_bin="$(find "${sdk_root}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          test -x "${sdkmanager_bin}"
          "${sdkmanager_bin}" "platforms;android-36.1" "build-tools;36.1.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"

      - name: Extract supplied project
        shell: bash
        run: |
          set -euo pipefail
          cat workbench/chunks/part-* | base64 --decode > reconstructed-project.zip
          echo "7e6d4456ab69c27b6a74b0317b5e8f6adaae9498d5cb4891097b4e1fc8823284  reconstructed-project.zip" | sha256sum --check
          mkdir -p target
          unzip -q reconstructed-project.zip -d target
          chmod +x target/gradlew

      - name: Prime exact Gradle dependency cache and assemble
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          set -euo pipefail
          cd target
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Package reusable local toolchain
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          set -euo pipefail
          package_root="${RUNNER_TEMP}/codex-android-toolchain"
          mkdir -p "${package_root}/android-sdk/build-tools" "${package_root}/android-sdk/platforms"
          cp -a "${ANDROID_SDK_ROOT}/build-tools/36.1.0" "${package_root}/android-sdk/build-tools/"
          cp -a "${ANDROID_SDK_ROOT}/platforms/android-36.1" "${package_root}/android-sdk/platforms/"
          cp -a "${ANDROID_SDK_ROOT}/platform-tools" "${package_root}/android-sdk/"
          cp -a "${ANDROID_SDK_ROOT}/licenses" "${package_root}/android-sdk/"
          cp -a "${GRADLE_USER_HOME}" "${package_root}/gradle-home"
          find "${package_root}/gradle-home" -type f -name '*.lock' -delete
          mkdir -p artifact
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/codex-android-toolchain.tar.gz" codex-android-toolchain
          split -b 400M -d -a 2 "${RUNNER_TEMP}/codex-android-toolchain.tar.gz" artifact/toolchain-part-
          cp target/app/build/outputs/apk/debug/app-debug.apk artifact/remote-reference-app-debug.apk
          {
            java -version
            target/gradlew --version
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
            sha256sum artifact/remote-reference-app-debug.apk
            sha256sum reconstructed-project.zip
          } > artifact/toolchain-manifest.txt 2>&1

      - name: Upload toolchain part 00
        uses: actions/upload-artifact@v7
        with:
          name: codex-local-toolchain-part-00
          path: artifact/toolchain-part-00
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain part 01
        uses: actions/upload-artifact@v7
        with:
          name: codex-local-toolchain-part-01
          path: artifact/toolchain-part-01
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain part 02
        uses: actions/upload-artifact@v7
        with:
          name: codex-local-toolchain-part-02
          path: artifact/toolchain-part-02
          compression-level: 0
          retention-days: 7

      - name: Upload reference APK and manifest
        uses: actions/upload-artifact@v7
        with:
          name: codex-reference-apk-and-manifest
          path: |
            artifact/remote-reference-app-debug.apk
            artifact/toolchain-manifest.txt
          compression-level: 0
          retention-days: 7
