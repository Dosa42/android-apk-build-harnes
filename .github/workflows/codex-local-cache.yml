name: Codex local Android toolchain cache

on:
  push:
    branches:
      - codex-embedded-source-build-20260827

permissions:
  contents: read

jobs:
  prepare-local-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          sdkmanager_bin="$(find "${sdk_root}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          test -x "${sdkmanager_bin}"
          "${sdkmanager_bin}" "platforms;android-36.1" "build-tools;36.1.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"

      - name: Extract supplied project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          unzip -q workbench/project-upload.zip -d target
          chmod +x target/gradlew

      - name: Prime exact Gradle dependency cache and assemble
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          set -euo pipefail
          cd target
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Package reusable local toolchain
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          set -euo pipefail
          package_root="${RUNNER_TEMP}/codex-android-toolchain"
          mkdir -p "${package_root}/android-sdk/build-tools" "${package_root}/android-sdk/platforms"
          cp -a "${ANDROID_SDK_ROOT}/build-tools/36.1.0" "${package_root}/android-sdk/build-tools/"
          cp -a "${ANDROID_SDK_ROOT}/platforms/android-36.1" "${package_root}/android-sdk/platforms/"
          cp -a "${ANDROID_SDK_ROOT}/platform-tools" "${package_root}/android-sdk/"
          cp -a "${ANDROID_SDK_ROOT}/licenses" "${package_root}/android-sdk/"
          cp -a "${GRADLE_USER_HOME}" "${package_root}/gradle-home"
          find "${package_root}/gradle-home" -type f -name '*.lock' -delete
          mkdir -p artifact
          tar -C "${RUNNER_TEMP}" -czf artifact/codex-android-toolchain.tar.gz codex-android-toolchain
          cp target/app/build/outputs/apk/debug/app-debug.apk artifact/remote-reference-app-debug.apk
          {
            java -version
            target/gradlew --version
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
            sha256sum artifact/remote-reference-app-debug.apk
            sha256sum workbench/project-upload.zip
          } > artifact/toolchain-manifest.txt 2>&1

      - name: Upload local toolchain
        uses: actions/upload-artifact@v7
        with:
          name: codex-local-toolchain-and-apk
          path: artifact/*
          compression-level: 0
          retention-days: 7
